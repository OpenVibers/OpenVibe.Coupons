## ═══════════════════════════════════════════════════════════════
## openvibe.coupons — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.coupons.conf — keep them in sync and reload nginx
## after changing it. The Node app (port 4850, systemd unit openvibe-coupons) renders every page;
## nginx terminates TLS, redirects www → apex, rate-limits auth, forms and API, and compresses text.
##
## No proxy_cache here on purpose: the app decides cacheability per response (public only for pages
## rendered for anonymous visitors and for the lookup API, whose answers are the same for everyone;
## private, no-store for everything else). CORS headers come from the app (extension origins on the
## two lookup routes only) — do not add any here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ovcoupons_lookup:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ovcoupons_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ovcoupons_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ovcoupons_forms:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.coupons www.openvibe.coupons;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.coupons$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.coupons;

    ssl_certificate     /etc/letsencrypt/live/openvibe.coupons/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.coupons/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.coupons$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.coupons;

    ssl_certificate     /etc/letsencrypt/live/openvibe.coupons/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.coupons/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.coupons.access.log;
    error_log  /var/log/nginx/openvibe.coupons.error.log;

    # Forms and JSON bodies are small (no uploads).
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json application/feed+json image/svg+xml text/plain application/xml text/xml application/rss+xml application/atom+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints (strict) ──────────────
    location /auth/ {
        limit_req zone=ovcoupons_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4850;
    }

    # ── The browser helper's lookups (the app also limits per install) ──
    location ~ ^/api/v1/merchants/(resolve|[^/]+/coupons)$ {
        limit_req zone=ovcoupons_lookup burst=20 nodelay;
        proxy_pass http://127.0.0.1:4850;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=ovcoupons_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:4850;
    }

    # ── Forms (submit, reports, connect-extension, staff) ───
    location ~ ^/(submit|connect-extension|staff|c/[^/]+/report|m/[^/]+/watch) {
        limit_req zone=ovcoupons_forms burst=10 nodelay;
        proxy_pass http://127.0.0.1:4850;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:4850/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, feeds, sitemaps, robots.txt, llms.txt, static assets ──
    location / {
        proxy_pass http://127.0.0.1:4850;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
